<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church of the First Mark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .divider {
            width: 100px;
            height: 2px;
            background-color: #ffffff;
            margin: 2rem auto;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .welcome-text {
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .logo {
                font-size: 3rem;
            }

            p {
                font-size: 1rem;
            }

            .welcome-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Church of the First Mark</h1>
        <div class="divider"></div>
        <p class="welcome-text">Welcome, beloved</p>
        <p>We are a community of faith, hope, and love.</p>
        <p>Together, we seek to follow the teachings of the First Mark and build a world of compassion and understanding.</p>
    </div>
</body>
</html>
